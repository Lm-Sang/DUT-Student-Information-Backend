version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: student_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/student_management
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: U3R1ZGVudE1hbmFnZW1lbnRTZWNyZXRLZXlGb3JEZXZlbG9wbWVudE9ubHkh
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
      REGISTRATION_DEADLINE: 2027-01-31
volumes:
  pg_data:
