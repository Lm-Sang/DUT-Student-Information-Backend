spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/student_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true

app:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  enrollment:
    min-credits: ${MIN_CREDITS:1}
    max-credits: ${MAX_CREDITS:24}
    registration-deadline: ${REGISTRATION_DEADLINE:2027-01-31}
  grade:
    midterm-weight: ${MIDTERM_WEIGHT:0.4}
    final-weight: ${FINAL_WEIGHT:0.6}
  jwt:
    secret: ${JWT_SECRET:U3R1ZGVudE1hbmFnZW1lbnRTZWNyZXRLZXlGb3JEZXZlbG9wbWVudE9ubHkh}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
